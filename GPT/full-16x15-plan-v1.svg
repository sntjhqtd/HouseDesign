<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1080" viewBox="0 0 1720 1080">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#52606d"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172b4d}
      .title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#5e6c84}.head{font-size:23px;font-weight:700}
      .label{font-size:18px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}.dim{font-size:14px;fill:#52606d}
      .outline{fill:#fff;stroke:#344563;stroke-width:3}.axis{stroke:#7a869a;stroke-width:1.8;stroke-dasharray:8 7}
      .wall{stroke:#344563;stroke-width:3}.thinwall{stroke:#52606d;stroke-width:2}.dimension{stroke:#52606d;stroke-width:1.4;marker-start:url(#arrow);marker-end:url(#arrow)}
      .column{fill:#344563}.door{fill:none;stroke:#344563;stroke-width:1.8}
    </style>
  </defs>

  <rect width="1720" height="1080" fill="#f7f9fc"/>
  <text x="860" y="42" text-anchor="middle" class="title">16m × 15m 商住自建房完整平面方案 V1</text>
  <text x="860" y="72" text-anchor="middle" class="sub">临街面在上方；柱网4m×5m；左侧后置四跑楼梯；电梯井2.4m×2.4m保持原位</text>

  <!-- LEFT: GROUND FLOOR -->
  <text x="430" y="115" text-anchor="middle" class="head">一层平面：三间商铺＋独立住宅交通</text>
  <rect x="110" y="135" width="640" height="52" rx="8" fill="#dfe3e8"/>
  <line x1="135" y1="161" x2="725" y2="161" stroke="#fff" stroke-width="4" stroke-dasharray="26 16"/>
  <text x="430" y="155" text-anchor="middle" class="label">临街道路 / 主要店面</text>

  <!-- Ground outline: scale40, x110..750, y215..815 -->
  <rect x="110" y="215" width="640" height="600" class="outline"/>
  <!-- structural axes -->
  <line x1="270" y1="215" x2="270" y2="815" class="axis"/>
  <line x1="430" y1="215" x2="430" y2="815" class="axis"/>
  <line x1="590" y1="215" x2="590" y2="815" class="axis"/>
  <line x1="110" y1="415" x2="750" y2="415" class="axis"/>
  <line x1="110" y1="615" x2="750" y2="615" class="axis"/>

  <!-- Shop A front: x1.4..8, y0..4.6 -->
  <rect x="166" y="215" width="264" height="184" fill="#dff3e4" stroke="#2d9d58" stroke-width="2"/>
  <text x="298" y="292" text-anchor="middle" class="head">商铺 A 前厅</text>
  <text x="298" y="322" text-anchor="middle" class="label">临街宽约6.6m</text>
  <text x="298" y="350" text-anchor="middle" class="small">利用释放出的2.6m门面</text>

  <!-- Residential entrance corridor -->
  <rect x="110" y="215" width="56" height="244" fill="#d9eafd" stroke="#0c66e4" stroke-width="3"/>
  <path d="M138 237V440" stroke="#0c66e4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="138" y="340" text-anchor="middle" class="small" transform="rotate(-90 138 340)">住宅入口通道 净宽约1.4m</text>
  <!-- residential entry door -->
  <line x1="118" y1="215" x2="156" y2="215" stroke="#fff" stroke-width="7"/>
  <path d="M118 215V253A38 38 0 0 1 156 215" class="door"/>

  <!-- Four-flight stair -->
  <rect x="166" y="399" width="104" height="120" fill="#cfe7ff" stroke="#0c66e4" stroke-width="3"/>
  <rect x="178" y="413" width="80" height="94" fill="#f5f9ff" stroke="#0c66e4" stroke-width="1.8"/>
  <rect x="204" y="442" width="28" height="36" fill="#e9ecef" stroke="#7a869a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M184 436H218V419H252V460H246V499H218V503H182V462" fill="none" stroke="#0c66e4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="218" y="458" text-anchor="middle" class="tiny">梯井</text>
  <text x="218" y="535" text-anchor="middle" class="label">四跑楼梯</text>
  <text x="218" y="558" text-anchor="middle" class="small">约2.6×3.0m</text>

  <!-- Elevator lobby -->
  <rect x="110" y="459" width="60" height="60" fill="#fff1b8" stroke="#e2a400" stroke-width="2.5"/>
  <circle cx="140" cy="489" r="27" fill="none" stroke="#e2a400" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="140" y="485" text-anchor="middle" class="tiny">候梯/平台</text>
  <text x="140" y="501" text-anchor="middle" class="tiny">约1.5×1.5m</text>

  <!-- Elevator -->
  <rect x="110" y="519" width="96" height="96" fill="#ffe2bd" stroke="#e56910" stroke-width="3"/>
  <line x1="112" y1="521" x2="204" y2="613" stroke="#e56910" stroke-width="1.5"/>
  <line x1="204" y1="521" x2="112" y2="613" stroke="#e56910" stroke-width="1.5"/>
  <text x="158" y="560" text-anchor="middle" class="label">电梯井</text>
  <text x="158" y="584" text-anchor="middle" class="small">2.4×2.4m</text>
  <line x1="124" y1="519" x2="172" y2="519" stroke="#fff" stroke-width="8"/>
  <line x1="124" y1="519" x2="172" y2="519" stroke="#e56910" stroke-width="1.8" stroke-dasharray="5 3"/>

  <!-- Meter / shaft area beside elevator -->
  <rect x="206" y="519" width="64" height="96" fill="#e8edf2" stroke="#7a869a" stroke-width="2"/>
  <text x="238" y="555" text-anchor="middle" class="small">水电表</text>
  <text x="238" y="577" text-anchor="middle" class="small">管井/储物</text>
  <text x="238" y="598" text-anchor="middle" class="tiny">兼隔声带</text>

  <!-- Shop A rear retail between x4..8 y4.6..10 -->
  <rect x="270" y="399" width="160" height="216" fill="#e8f6eb" stroke="#2d9d58" stroke-width="2"/>
  <text x="350" y="492" text-anchor="middle" class="label">商铺 A 后厅</text>
  <text x="350" y="519" text-anchor="middle" class="small">前后连通宽4m</text>
  <text x="350" y="543" text-anchor="middle" class="small">核心筒藏在左后侧</text>

  <!-- Shop B and C front/middle -->
  <rect x="430" y="215" width="160" height="400" fill="#eef8e9" stroke="#69a84f" stroke-width="2"/>
  <rect x="590" y="215" width="160" height="400" fill="#f3faef" stroke="#69a84f" stroke-width="2"/>
  <text x="510" y="365" text-anchor="middle" class="head">商铺 B</text>
  <text x="510" y="395" text-anchor="middle" class="small">4m×10m营业区</text>
  <text x="670" y="365" text-anchor="middle" class="head">商铺 C</text>
  <text x="670" y="395" text-anchor="middle" class="small">4m×10m营业区</text>

  <!-- Rear service zones -->
  <rect x="110" y="615" width="320" height="200" fill="#f6f0e4" stroke="#a6772e" stroke-width="2"/>
  <rect x="430" y="615" width="160" height="200" fill="#f8f3e9" stroke="#a6772e" stroke-width="2"/>
  <rect x="590" y="615" width="160" height="200" fill="#f8f3e9" stroke="#a6772e" stroke-width="2"/>
  <text x="270" y="690" text-anchor="middle" class="label">商铺 A 后勤/仓库</text>
  <text x="270" y="716" text-anchor="middle" class="small">约8m×5m，可再分仓储、办公</text>
  <text x="510" y="690" text-anchor="middle" class="label">商铺 B 后勤</text>
  <text x="670" y="690" text-anchor="middle" class="label">商铺 C 后勤</text>

  <!-- WCs at rear-right of each zone -->
  <rect x="374" y="735" width="56" height="80" fill="#dff1f5" stroke="#248a9c" stroke-width="2"/>
  <rect x="542" y="735" width="48" height="80" fill="#dff1f5" stroke="#248a9c" stroke-width="2"/>
  <rect x="702" y="735" width="48" height="80" fill="#dff1f5" stroke="#248a9c" stroke-width="2"/>
  <text x="402" y="775" text-anchor="middle" class="small">A卫生间</text>
  <text x="566" y="775" text-anchor="middle" class="small">B卫生间</text>
  <text x="726" y="775" text-anchor="middle" class="small">C卫生间</text>
  <text x="510" y="848" text-anchor="middle" class="small" fill="#7a5d27">后部5m用途可按商铺业态调整；餐饮需另做排烟、隔油和消防</text>

  <!-- Ground columns -->
  <g>
    <rect x="103" y="208" width="14" height="14" class="column"/><rect x="263" y="208" width="14" height="14" class="column"/><rect x="423" y="208" width="14" height="14" class="column"/><rect x="583" y="208" width="14" height="14" class="column"/><rect x="743" y="208" width="14" height="14" class="column"/>
    <rect x="103" y="408" width="14" height="14" class="column"/><rect x="263" y="408" width="14" height="14" class="column"/><rect x="423" y="408" width="14" height="14" class="column"/><rect x="583" y="408" width="14" height="14" class="column"/><rect x="743" y="408" width="14" height="14" class="column"/>
    <rect x="103" y="608" width="14" height="14" class="column"/><rect x="263" y="608" width="14" height="14" class="column"/><rect x="423" y="608" width="14" height="14" class="column"/><rect x="583" y="608" width="14" height="14" class="column"/><rect x="743" y="608" width="14" height="14" class="column"/>
    <rect x="103" y="808" width="14" height="14" class="column"/><rect x="263" y="808" width="14" height="14" class="column"/><rect x="423" y="808" width="14" height="14" class="column"/><rect x="583" y="808" width="14" height="14" class="column"/><rect x="743" y="808" width="14" height="14" class="column"/>
  </g>

  <!-- Ground dimensions -->
  <line x1="110" y1="200" x2="750" y2="200" class="dimension"/><text x="430" y="195" text-anchor="middle" class="dim">总开间16m（4m＋4m＋4m＋4m）</text>
  <line x1="775" y1="215" x2="775" y2="815" class="dimension"/><text x="798" y="515" text-anchor="middle" class="dim" transform="rotate(90 798 515)">总进深15m（5m＋5m＋5m）</text>

  <!-- RIGHT: TYPICAL UPPER FLOOR -->
  <text x="1190" y="115" text-anchor="middle" class="head">二层以上完整轮廓：固定交通核心＋住宅可布置区</text>
  <rect x="870" y="135" width="640" height="52" rx="8" fill="#dfe3e8"/>
  <line x1="895" y1="161" x2="1485" y2="161" stroke="#fff" stroke-width="4" stroke-dasharray="26 16"/>
  <text x="1190" y="155" text-anchor="middle" class="label">临街方向</text>

  <rect x="870" y="215" width="640" height="600" class="outline"/>
  <line x1="1030" y1="215" x2="1030" y2="815" class="axis"/>
  <line x1="1190" y1="215" x2="1190" y2="815" class="axis"/>
  <line x1="1350" y1="215" x2="1350" y2="815" class="axis"/>
  <line x1="870" y1="415" x2="1510" y2="415" class="axis"/>
  <line x1="870" y1="615" x2="1510" y2="615" class="axis"/>

  <!-- Residential zones -->
  <rect x="870" y="215" width="640" height="184" fill="#e7f0fb" stroke="#5588c7" stroke-width="2"/>
  <text x="1190" y="286" text-anchor="middle" class="head">临街住宅空间</text>
  <text x="1190" y="316" text-anchor="middle" class="label">建议：客厅、书房、阳台或次卧</text>
  <text x="1190" y="344" text-anchor="middle" class="small">具体取决于道路朝向、噪声和日照</text>

  <rect x="1030" y="399" width="480" height="216" fill="#edf5ff" stroke="#5588c7" stroke-width="2"/>
  <text x="1270" y="478" text-anchor="middle" class="head">住宅中部公共空间</text>
  <text x="1270" y="508" text-anchor="middle" class="label">建议：餐厅、厨房、家庭厅</text>
  <text x="1270" y="536" text-anchor="middle" class="small">厨房和卫生间靠近交通核心布置，便于上下对管</text>

  <rect x="870" y="615" width="640" height="200" fill="#f2f0fa" stroke="#7665a8" stroke-width="2"/>
  <text x="1190" y="692" text-anchor="middle" class="head">后部安静区</text>
  <text x="1190" y="722" text-anchor="middle" class="label">建议：主卧、次卧、老人房、后阳台</text>
  <text x="1190" y="750" text-anchor="middle" class="small">若左右不能开窗，应在中部设置采光井或露台</text>

  <!-- upper stair -->
  <rect x="926" y="399" width="104" height="120" fill="#cfe7ff" stroke="#0c66e4" stroke-width="3"/>
  <rect x="938" y="413" width="80" height="94" fill="#f5f9ff" stroke="#0c66e4" stroke-width="1.8"/>
  <rect x="964" y="442" width="28" height="36" fill="#e9ecef" stroke="#7a869a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M944 436H978V419H1012V460H1006V499H978V503H942V462" fill="none" stroke="#0c66e4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="978" y="458" text-anchor="middle" class="tiny">梯井</text>
  <text x="978" y="535" text-anchor="middle" class="small">四跑楼梯</text>

  <!-- upper lobby -->
  <rect x="870" y="459" width="60" height="60" fill="#fff1b8" stroke="#e2a400" stroke-width="2.5"/>
  <circle cx="900" cy="489" r="27" fill="none" stroke="#e2a400" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="900" y="484" text-anchor="middle" class="tiny">候梯平台</text>
  <text x="900" y="501" text-anchor="middle" class="tiny">1.5×1.5m</text>

  <!-- upper elevator -->
  <rect x="870" y="519" width="96" height="96" fill="#ffe2bd" stroke="#e56910" stroke-width="3"/>
  <line x1="872" y1="521" x2="964" y2="613" stroke="#e56910" stroke-width="1.5"/>
  <line x1="964" y1="521" x2="872" y2="613" stroke="#e56910" stroke-width="1.5"/>
  <text x="918" y="560" text-anchor="middle" class="label">电梯井</text>
  <text x="918" y="584" text-anchor="middle" class="small">2.4×2.4m</text>
  <line x1="884" y1="519" x2="932" y2="519" stroke="#fff" stroke-width="8"/>
  <line x1="884" y1="519" x2="932" y2="519" stroke="#e56910" stroke-width="1.8" stroke-dasharray="5 3"/>
  <rect x="966" y="519" width="64" height="96" fill="#e8edf2" stroke="#7a869a" stroke-width="2"/>
  <text x="998" y="557" text-anchor="middle" class="small">卫生间</text>
  <text x="998" y="579" text-anchor="middle" class="small">管井/储物</text>

  <!-- Residential entry from core -->
  <path d="M1030 489H1088" stroke="#0c66e4" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1070" y="475" text-anchor="middle" class="small">入户玄关</text>

  <!-- upper columns -->
  <g>
    <rect x="863" y="208" width="14" height="14" class="column"/><rect x="1023" y="208" width="14" height="14" class="column"/><rect x="1183" y="208" width="14" height="14" class="column"/><rect x="1343" y="208" width="14" height="14" class="column"/><rect x="1503" y="208" width="14" height="14" class="column"/>
    <rect x="863" y="408" width="14" height="14" class="column"/><rect x="1023" y="408" width="14" height="14" class="column"/><rect x="1183" y="408" width="14" height="14" class="column"/><rect x="1343" y="408" width="14" height="14" class="column"/><rect x="1503" y="408" width="14" height="14" class="column"/>
    <rect x="863" y="608" width="14" height="14" class="column"/><rect x="1023" y="608" width="14" height="14" class="column"/><rect x="1183" y="608" width="14" height="14" class="column"/><rect x="1343" y="608" width="14" height="14" class="column"/><rect x="1503" y="608" width="14" height="14" class="column"/>
    <rect x="863" y="808" width="14" height="14" class="column"/><rect x="1023" y="808" width="14" height="14" class="column"/><rect x="1183" y="808" width="14" height="14" class="column"/><rect x="1343" y="808" width="14" height="14" class="column"/><rect x="1503" y="808" width="14" height="14" class="column"/>
  </g>

  <!-- upper dimensions -->
  <line x1="870" y1="200" x2="1510" y2="200" class="dimension"/><text x="1190" y="195" text-anchor="middle" class="dim">总开间16m（4m＋4m＋4m＋4m）</text>
  <line x1="1535" y1="215" x2="1535" y2="815" class="dimension"/><text x="1558" y="515" text-anchor="middle" class="dim" transform="rotate(90 1558 515)">总进深15m（5m＋5m＋5m）</text>

  <!-- Footer notes -->
  <rect x="110" y="890" width="1400" height="135" rx="10" fill="#fff" stroke="#b3bac5" stroke-width="2"/>
  <text x="140" y="925" class="label">深化提醒</text>
  <text x="140" y="955" class="small">1. 一层楼梯洞口跨原5m轴线梁附近，必须由结构工程师改为洞口边梁；不得现场切梁。  2. 商铺卫生间、排烟及后勤仅为示意，应按实际业态调整。</text>
  <text x="140" y="983" class="small">3. 二层以上当前只固定交通核心和功能分区；确定家庭人数、房间数量、道路朝向及左右能否开窗后，再输出带家具和尺寸的住宅户型。</text>
  <text x="140" y="1011" class="small">4. 图中尺寸为方案控制尺寸，不包含最终墙体、抹灰和结构施工误差；不可直接作为现场放线或钢筋施工图。</text>
</svg>
