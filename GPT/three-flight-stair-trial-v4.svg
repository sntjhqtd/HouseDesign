<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1030" viewBox="0 0 1680 1030">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0c66e4"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172b4d}
      .title{font-size:29px;font-weight:700}.sub{font-size:17px;fill:#5e6c84}.head{font-size:22px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:14px}.tiny{font-size:12px}.dim{font-size:13px;fill:#52606d}
      .outline{fill:#fff;stroke:#344563;stroke-width:3}.wall{stroke:#344563;stroke-width:3;fill:none}.axis{stroke:#7a869a;stroke-width:1.5;stroke-dasharray:7 6}.dimension{stroke:#52606d;stroke-width:1.4;marker-start:url(#arrowGray);marker-end:url(#arrowGray)}
      .run{fill:#e5f1ff;stroke:#0c66e4;stroke-width:2}.landing{fill:#fff1b8;stroke:#e2a400;stroke-width:2}.connector{fill:#d8f3dc;stroke:#2d9d58;stroke-width:2}.warn{fill:#c9372c}.column{fill:#344563}
    </style>
  </defs>
  <rect width="1680" height="1030" fill="#f7f9fc"/>
  <text x="840" y="42" text-anchor="middle" class="title">三跑楼梯试排：4m×5m楼梯间</text>
  <text x="840" y="72" text-anchor="middle" class="sub">民宿公共楼梯按踏步高不大于165mm控制；三跑的上下层落点会前后交替</text>

  <!-- PANEL 1 -->
  <text x="300" y="118" text-anchor="middle" class="head">一层 → 二层：上层落在后平台</text>
  <text x="300" y="145" text-anchor="middle" class="small">层高4.00m：27级＝9＋9＋9级</text>
  <!-- 4x5 at 80px/m: 320x400 x140 y190 -->
  <rect x="140" y="190" width="320" height="400" class="outline"/>
  <!-- front and rear landings 1.2m -->
  <rect x="154" y="204" width="292" height="96" class="landing"/>
  <rect x="154" y="480" width="292" height="96" class="landing"/>
  <text x="300" y="236" text-anchor="middle" class="small">前平台1.20m：一层入口</text>
  <text x="300" y="548" text-anchor="middle" class="small">后平台1.20m：二层出口</text>
  <!-- three parallel runs, 1.1m each -->
  <rect x="154" y="300" width="88" height="180" class="run"/>
  <rect x="256" y="300" width="88" height="180" class="run"/>
  <rect x="358" y="300" width="88" height="180" class="run"/>
  <!-- tread lines -->
  <g stroke="#0c66e4" stroke-width="1.2">
    <line x1="154" y1="322" x2="242" y2="322"/><line x1="154" y1="344" x2="242" y2="344"/><line x1="154" y1="366" x2="242" y2="366"/><line x1="154" y1="388" x2="242" y2="388"/><line x1="154" y1="410" x2="242" y2="410"/><line x1="154" y1="432" x2="242" y2="432"/><line x1="154" y1="454" x2="242" y2="454"/>
    <line x1="256" y1="322" x2="344" y2="322"/><line x1="256" y1="344" x2="344" y2="344"/><line x1="256" y1="366" x2="344" y2="366"/><line x1="256" y1="388" x2="344" y2="388"/><line x1="256" y1="410" x2="344" y2="410"/><line x1="256" y1="432" x2="344" y2="432"/><line x1="256" y1="454" x2="344" y2="454"/>
    <line x1="358" y1="322" x2="446" y2="322"/><line x1="358" y1="344" x2="446" y2="344"/><line x1="358" y1="366" x2="446" y2="366"/><line x1="358" y1="388" x2="446" y2="388"/><line x1="358" y1="410" x2="446" y2="410"/><line x1="358" y1="432" x2="446" y2="432"/><line x1="358" y1="454" x2="446" y2="454"/>
  </g>
  <path d="M198 280V460M300 460V320M402 320V460" fill="none" stroke="#0c66e4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="198" y="395" text-anchor="middle" class="tiny">第1跑↑</text><text x="300" y="395" text-anchor="middle" class="tiny">第2跑↓</text><text x="402" y="395" text-anchor="middle" class="tiny">第3跑↑</text>
  <text x="300" y="615" text-anchor="middle" class="label">二层后平台可直接接电梯前室和公共走道</text>
  <line x1="125" y1="190" x2="125" y2="590" class="dimension"/><text x="105" y="390" text-anchor="middle" class="dim" transform="rotate(-90 105 390)">5.0m</text><line x1="140" y1="175" x2="460" y2="175" class="dimension"/><text x="300" y="170" text-anchor="middle" class="dim">4.0m</text>

  <!-- PANEL 2 -->
  <text x="760" y="118" text-anchor="middle" class="head">二层 → 三层：上层落在前平台</text>
  <text x="760" y="145" text-anchor="middle" class="small">层高3.30m：21级＝7＋7＋7级</text>
  <rect x="600" y="190" width="320" height="400" class="outline"/>
  <rect x="614" y="204" width="292" height="96" class="landing"/><rect x="614" y="480" width="292" height="96" class="landing"/>
  <text x="760" y="236" text-anchor="middle" class="small">前平台：三层出口</text><text x="760" y="548" text-anchor="middle" class="small">后平台：二层入口</text>
  <rect x="614" y="320" width="88" height="140" class="run"/><rect x="716" y="320" width="88" height="140" class="run"/><rect x="818" y="320" width="88" height="140" class="run"/>
  <g stroke="#0c66e4" stroke-width="1.2">
    <line x1="614" y1="340" x2="702" y2="340"/><line x1="614" y1="360" x2="702" y2="360"/><line x1="614" y1="380" x2="702" y2="380"/><line x1="614" y1="400" x2="702" y2="400"/><line x1="614" y1="420" x2="702" y2="420"/><line x1="614" y1="440" x2="702" y2="440"/>
    <line x1="716" y1="340" x2="804" y2="340"/><line x1="716" y1="360" x2="804" y2="360"/><line x1="716" y1="380" x2="804" y2="380"/><line x1="716" y1="400" x2="804" y2="400"/><line x1="716" y1="420" x2="804" y2="420"/><line x1="716" y1="440" x2="804" y2="440"/>
    <line x1="818" y1="340" x2="906" y2="340"/><line x1="818" y1="360" x2="906" y2="360"/><line x1="818" y1="380" x2="906" y2="380"/><line x1="818" y1="400" x2="906" y2="400"/><line x1="818" y1="420" x2="906" y2="420"/><line x1="818" y1="440" x2="906" y2="440"/>
  </g>
  <path d="M658 480V335M760 335V450M862 450V315" fill="none" stroke="#0c66e4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="658" y="395" text-anchor="middle" class="tiny">第1跑↑</text><text x="760" y="395" text-anchor="middle" class="tiny">第2跑↓</text><text x="862" y="395" text-anchor="middle" class="tiny">第3跑↑</text>
  <text x="760" y="615" text-anchor="middle" class="label warn">三层出口落在临街侧，不能直接到后方走道</text>

  <!-- PANEL 3: integration -->
  <text x="1290" y="118" text-anchor="middle" class="head">放进现有柱网后的处理</text>
  <text x="1290" y="145" text-anchor="middle" class="small">左前4×5m整格做三跑楼梯；右侧另留1.2m连接通道</text>
  <!-- 8x10m partial plan scale50 -->
  <rect x="1040" y="190" width="400" height="500" class="outline"/>
  <line x1="1240" y1="190" x2="1240" y2="690" class="axis"/><line x1="1040" y1="440" x2="1440" y2="440" class="axis"/>
  <!-- stair whole first bay -->
  <rect x="1040" y="190" width="200" height="250" fill="#e5f1ff" stroke="#0c66e4" stroke-width="3"/>
  <rect x="1050" y="202" width="180" height="55" class="landing"/><rect x="1050" y="375" width="180" height="55" class="landing"/>
  <rect x="1050" y="257" width="52" height="118" class="run"/><rect x="1114" y="257" width="52" height="118" class="run"/><rect x="1178" y="257" width="52" height="118" class="run"/>
  <path d="M1076 247V365M1140 365V270M1204 270V365" fill="none" stroke="#0c66e4" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="1140" y="320" text-anchor="middle" class="label">三跑楼梯4×5m</text>
  <!-- 1.2m side connector -->
  <rect x="1240" y="190" width="60" height="310" class="connector"/>
  <path d="M1270 215V480" fill="none" stroke="#2d9d58" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="1270" y="340" text-anchor="middle" class="small" transform="rotate(-90 1270 340)">1.2m侧向连接通道</text>
  <!-- elevator and lobby -->
  <rect x="1040" y="570" width="120" height="120" fill="#ffe2bd" stroke="#e56910" stroke-width="3"/><line x1="1042" y1="572" x2="1158" y2="688" stroke="#e56910"/><line x1="1158" y1="572" x2="1042" y2="688" stroke="#e56910"/><text x="1100" y="624" text-anchor="middle" class="label">电梯井</text><text x="1100" y="649" text-anchor="middle" class="small">2.4×2.4m</text>
  <rect x="1040" y="440" width="200" height="130" fill="#fff1b8" fill-opacity="0.8" stroke="#e2a400" stroke-width="2"/><text x="1140" y="500" text-anchor="middle" class="label">原2.6m电梯前室</text><text x="1140" y="525" text-anchor="middle" class="small">可兼前台、候梯和楼梯后平台</text>
  <!-- adjacent room/shop loss -->
  <rect x="1300" y="190" width="140" height="500" fill="#f2f0fa" stroke="#7665a8" stroke-width="2"/><text x="1370" y="350" text-anchor="middle" class="label">相邻商铺/客房</text><text x="1370" y="375" text-anchor="middle" class="small">被连接通道占1.2m</text><text x="1370" y="400" text-anchor="middle" class="small">有效宽度减少</text>
  <!-- columns -->
  <g><rect x="1033" y="183" width="14" height="14" class="column"/><rect x="1233" y="183" width="14" height="14" class="column"/><rect x="1433" y="183" width="14" height="14" class="column"/><rect x="1033" y="433" width="14" height="14" class="column"/><rect x="1233" y="433" width="14" height="14" class="column"/><rect x="1433" y="433" width="14" height="14" class="column"/><rect x="1033" y="683" width="14" height="14" class="column"/><rect x="1233" y="683" width="14" height="14" class="column"/><rect x="1433" y="683" width="14" height="14" class="column"/></g>
  <text x="1240" y="720" text-anchor="middle" class="label warn">结果：三跑楼梯必须重新占满4m临街开间</text>

  <!-- calculation cards -->
  <rect x="110" y="760" width="460" height="205" rx="10" fill="#fff" stroke="#b3bac5" stroke-width="2"/>
  <text x="140" y="800" class="head">踏步计算</text>
  <text x="140" y="838" class="label">一层4.00m</text><text x="260" y="838" class="small">27级，单级148.1mm</text>
  <text x="140" y="868" class="small">每跑9级、8个踏面；8×260＝2.08m水平长度</text>
  <text x="140" y="905" class="label">二层至三层3.30m</text><text x="325" y="905" class="small">21级，单级157.1mm</text>
  <text x="140" y="935" class="small">每跑7级、6个踏面；6×260＝1.56m水平长度</text>

  <rect x="610" y="760" width="460" height="205" rx="10" fill="#fff" stroke="#b3bac5" stroke-width="2"/>
  <text x="640" y="800" class="head">优点</text>
  <text x="640" y="838" class="small">• 三跑级数分配整齐，坡度舒适，搬运行李较方便</text>
  <text x="640" y="870" class="small">• 4×5m原柱网整格能够容纳，不需要移动柱位</text>
  <text x="640" y="902" class="small">• 二层后平台与现有2.6m电梯前室衔接自然</text>
  <text x="640" y="934" class="small">• 楼梯形式简单，支模通常比紧凑四跑容易</text>

  <rect x="1110" y="760" width="460" height="205" rx="10" fill="#fff" stroke="#c9372c" stroke-width="2"/>
  <text x="1140" y="800" class="head warn">代价</text>
  <text x="1140" y="838" class="small">• 主楼梯重新占满4m临街开间，商铺门面减少</text>
  <text x="1140" y="870" class="small">• 三层出口落在楼梯前端，需要1.2m侧向连接通道</text>
  <text x="1140" y="902" class="small">• 相邻客房或商铺被通道切掉约1.2m宽</text>
  <text x="1140" y="934" class="small">• 原5m轴线梁和楼板洞口仍需结构工程师重新设计</text>

  <text x="1640" y="1000" text-anchor="end" class="tiny" fill="#6b778c">三跑楼梯可行性方案，不可直接作为楼梯配筋或施工放样图</text>
</svg>
