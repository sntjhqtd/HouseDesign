<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#52606d"/>
    </marker>
    <pattern id="stairs" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0H12" stroke="#0c66e4" stroke-width="1.5"/>
    </pattern>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #5e6c84; }
      .label { font-size: 20px; font-weight: 650; }
      .small { font-size: 16px; }
      .dim { font-size: 16px; fill: #52606d; }
      .grid { stroke: #344563; stroke-width: 3; fill: none; }
      .axis { stroke: #7a869a; stroke-width: 2; stroke-dasharray: 8 7; }
      .newwall { stroke: #0c66e4; stroke-width: 4; }
      .dimension { stroke: #52606d; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .column { fill: #344563; }
    </style>
  </defs>

  <rect width="1200" height="930" fill="#f7f9fc"/>
  <text x="600" y="42" text-anchor="middle" class="title">推荐调整：左侧交通带由4.0m压缩为3.0m</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">保留原4m×5m柱网；释放的1m并入相邻商铺</text>

  <!-- Street -->
  <rect x="180" y="92" width="720" height="60" rx="8" fill="#dfe3e8"/>
  <line x1="205" y1="122" x2="875" y2="122" stroke="#ffffff" stroke-width="4" stroke-dasharray="28 18"/>
  <text x="540" y="116" text-anchor="middle" class="label">临街道路</text>
  <text x="540" y="140" text-anchor="middle" class="small">建筑正面</text>

  <!-- Main plan: 45 px per metre, 16m x 15m -->
  <!-- x=180..900, y=180..855 -->
  <rect x="180" y="180" width="720" height="675" fill="#fff" class="grid"/>

  <!-- Original structural grid -->
  <line x1="360" y1="180" x2="360" y2="855" class="axis"/>
  <line x1="540" y1="180" x2="540" y2="855" class="axis"/>
  <line x1="720" y1="180" x2="720" y2="855" class="axis"/>
  <line x1="180" y1="405" x2="900" y2="405" class="axis"/>
  <line x1="180" y1="630" x2="900" y2="630" class="axis"/>

  <!-- Residential vertical circulation strip, 3m wide and 10m deep -->
  <rect x="180" y="180" width="135" height="450" fill="#d9eafd" opacity="0.92"/>
  <line x1="315" y1="180" x2="315" y2="630" class="newwall"/>

  <!-- Recovered 1m strip -->
  <rect x="315" y="180" width="45" height="450" fill="#d8f3dc" stroke="#2d9d58" stroke-width="2"/>
  <text x="338" y="350" text-anchor="middle" class="small" transform="rotate(-90 338 350)">释放1.0m并入商铺</text>

  <!-- Shop areas for first 10m -->
  <rect x="315" y="180" width="225" height="450" fill="#eaf7ed" opacity="0.55" stroke="#2d9d58" stroke-width="2"/>
  <rect x="540" y="180" width="180" height="450" fill="#f1f8ee" opacity="0.7" stroke="#69a84f" stroke-width="2"/>
  <rect x="720" y="180" width="180" height="450" fill="#f1f8ee" opacity="0.7" stroke="#69a84f" stroke-width="2"/>
  <text x="428" y="290" text-anchor="middle" class="label">商铺 A</text>
  <text x="428" y="320" text-anchor="middle" class="small">临街宽约5.0m</text>
  <text x="630" y="290" text-anchor="middle" class="label">商铺 B</text>
  <text x="630" y="320" text-anchor="middle" class="small">临街宽4.0m</text>
  <text x="810" y="290" text-anchor="middle" class="label">商铺 C</text>
  <text x="810" y="320" text-anchor="middle" class="small">临街宽4.0m</text>

  <!-- Schematic U-shaped stair in front 3m x 5m zone -->
  <rect x="194" y="200" width="48" height="165" fill="url(#stairs)" stroke="#0c66e4" stroke-width="2"/>
  <rect x="253" y="200" width="48" height="165" fill="url(#stairs)" stroke="#0c66e4" stroke-width="2"/>
  <rect x="194" y="365" width="107" height="28" fill="#b3d4ff" stroke="#0c66e4" stroke-width="2"/>
  <path d="M218 345V220" stroke="#0c66e4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M277 220V345" stroke="#0c66e4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="247" y="385" text-anchor="middle" class="small">双跑楼梯示意</text>
  <text x="247" y="420" text-anchor="middle" class="label">楼梯＋住宅入口</text>
  <text x="247" y="446" text-anchor="middle" class="small">控制宽度约3.0m</text>

  <!-- Elevator lobby -->
  <rect x="180" y="405" width="135" height="117" fill="#cfe7ff" stroke="#0c66e4" stroke-width="2"/>
  <text x="247" y="458" text-anchor="middle" class="label">电梯前室</text>
  <text x="247" y="484" text-anchor="middle" class="small">与楼梯直接连通</text>

  <!-- Elevator shaft: 2.4m x 2.4m in rear-left of middle section -->
  <rect x="180" y="522" width="108" height="108" fill="#ffe2bd" stroke="#e56910" stroke-width="4"/>
  <line x1="182" y1="524" x2="286" y2="628" stroke="#e56910" stroke-width="2"/>
  <line x1="286" y1="524" x2="182" y2="628" stroke="#e56910" stroke-width="2"/>
  <text x="234" y="566" text-anchor="middle" class="label">电梯井</text>
  <text x="234" y="594" text-anchor="middle" class="small">2.4×2.4m</text>
  <!-- Elevator opening to lobby -->
  <line x1="215" y1="522" x2="253" y2="522" stroke="#fff" stroke-width="7"/>
  <line x1="215" y1="522" x2="253" y2="522" stroke="#e56910" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Back section -->
  <rect x="180" y="630" width="720" height="225" fill="#f5f1e8" opacity="0.8"/>
  <text x="540" y="735" text-anchor="middle" class="label">后部5m：仓库、卫生间、设备、采光院等</text>
  <text x="540" y="765" text-anchor="middle" class="small">具体用途需要结合商铺业态、后方开窗与消防条件</text>

  <!-- Columns at original grid intersections -->
  <g>
    <rect x="173" y="173" width="14" height="14" class="column"/><rect x="353" y="173" width="14" height="14" class="column"/><rect x="533" y="173" width="14" height="14" class="column"/><rect x="713" y="173" width="14" height="14" class="column"/><rect x="893" y="173" width="14" height="14" class="column"/>
    <rect x="173" y="398" width="14" height="14" class="column"/><rect x="353" y="398" width="14" height="14" class="column"/><rect x="533" y="398" width="14" height="14" class="column"/><rect x="713" y="398" width="14" height="14" class="column"/><rect x="893" y="398" width="14" height="14" class="column"/>
    <rect x="173" y="623" width="14" height="14" class="column"/><rect x="353" y="623" width="14" height="14" class="column"/><rect x="533" y="623" width="14" height="14" class="column"/><rect x="713" y="623" width="14" height="14" class="column"/><rect x="893" y="623" width="14" height="14" class="column"/>
    <rect x="173" y="848" width="14" height="14" class="column"/><rect x="353" y="848" width="14" height="14" class="column"/><rect x="533" y="848" width="14" height="14" class="column"/><rect x="713" y="848" width="14" height="14" class="column"/><rect x="893" y="848" width="14" height="14" class="column"/>
  </g>

  <!-- New frontage dimensions -->
  <line x1="180" y1="166" x2="315" y2="166" class="dimension"/>
  <text x="247" y="160" text-anchor="middle" class="dim">交通带 3.0m</text>
  <line x1="315" y1="166" x2="540" y2="166" class="dimension"/>
  <text x="428" y="160" text-anchor="middle" class="dim">商铺A 5.0m</text>
  <line x1="540" y1="166" x2="720" y2="166" class="dimension"/>
  <text x="630" y="160" text-anchor="middle" class="dim">4.0m</text>
  <line x1="720" y1="166" x2="900" y2="166" class="dimension"/>
  <text x="810" y="160" text-anchor="middle" class="dim">4.0m</text>

  <!-- Depth dimensions -->
  <line x1="940" y1="180" x2="940" y2="855" class="dimension"/>
  <text x="967" y="520" class="dim" transform="rotate(90 967 520)">总进深15m（5m＋5m＋5m）</text>

  <!-- Notes -->
  <rect x="985" y="190" width="185" height="235" rx="10" fill="#fff" stroke="#b3bac5"/>
  <text x="1002" y="220" class="label">图例与提醒</text>
  <rect x="1002" y="240" width="20" height="20" fill="#344563"/><text x="1032" y="257" class="small">原柱位</text>
  <line x1="1002" y1="284" x2="1024" y2="284" class="axis"/><text x="1032" y="290" class="small">原4m柱网线</text>
  <line x1="1002" y1="320" x2="1024" y2="320" class="newwall"/><text x="1032" y="326" class="small">新隔墙位置</text>
  <text x="1002" y="360" class="small">3m为方案控制宽度，</text>
  <text x="1002" y="384" class="small">不是楼梯净宽。</text>
  <text x="1002" y="408" class="small">最终按层高和规范复核。</text>

  <text x="1170" y="902" text-anchor="end" class="small" fill="#6b778c">概念示意，不作为结构或施工图</text>
</svg>
