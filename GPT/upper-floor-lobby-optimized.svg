<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="880" viewBox="0 0 1180 880">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#52606d"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill:#172b4d; }
      .title { font-size:28px; font-weight:700; }
      .sub { font-size:18px; fill:#5e6c84; }
      .head { font-size:23px; font-weight:700; }
      .label { font-size:18px; font-weight:650; }
      .small { font-size:15px; }
      .dim { font-size:15px; fill:#52606d; }
      .outline { stroke:#344563; stroke-width:3; fill:#fff; }
      .wall { stroke:#344563; stroke-width:3; }
      .dimension { stroke:#52606d; stroke-width:1.5; marker-start:url(#arrow); marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1180" height="880" fill="#f7f9fc"/>
  <text x="590" y="43" text-anchor="middle" class="title">二层及以上：电梯前空间优化</text>
  <text x="590" y="72" text-anchor="middle" class="sub">2.6m是电梯井前的结构余量，不必整块都作为空候梯厅</text>

  <!-- Left: before -->
  <text x="300" y="118" text-anchor="middle" class="head">原理解：整块做前室</text>
  <text x="300" y="145" text-anchor="middle" class="sub">面积约 3.0×2.6＝7.8㎡</text>

  <!-- 3m x 10m zoom, scale 60px/m -->
  <rect x="210" y="180" width="180" height="600" class="outline"/>
  <!-- stair 3x5 -->
  <rect x="210" y="180" width="180" height="300" fill="#d9eafd" stroke="#0c66e4" stroke-width="2"/>
  <path d="M235 435V230H285V435M315 230V435H365V230" fill="none" stroke="#0c66e4" stroke-width="3"/>
  <text x="300" y="310" text-anchor="middle" class="label">楼梯</text>
  <text x="300" y="337" text-anchor="middle" class="small">3.0×5.0m</text>
  <!-- full lobby 3x2.6 -->
  <rect x="210" y="480" width="180" height="156" fill="#fff1b8" stroke="#e2a400" stroke-width="3"/>
  <text x="300" y="548" text-anchor="middle" class="label">整块电梯前室</text>
  <text x="300" y="577" text-anchor="middle" class="small">深2.6m，利用率较低</text>
  <!-- lift -->
  <rect x="210" y="636" width="144" height="144" fill="#ffe2bd" stroke="#e56910" stroke-width="4"/>
  <line x1="212" y1="638" x2="352" y2="778" stroke="#e56910" stroke-width="2"/>
  <line x1="352" y1="638" x2="212" y2="778" stroke="#e56910" stroke-width="2"/>
  <text x="282" y="700" text-anchor="middle" class="label">电梯井</text>
  <text x="282" y="729" text-anchor="middle" class="small">2.4×2.4m</text>
  <rect x="354" y="636" width="36" height="144" fill="#e9ecef"/>

  <!-- Right: optimized -->
  <text x="785" y="118" text-anchor="middle" class="head">推荐：候梯区＋连接通道</text>
  <text x="785" y="145" text-anchor="middle" class="sub">其余面积并入住宅玄关、储物或房间</text>

  <rect x="695" y="180" width="180" height="600" class="outline"/>
  <!-- stair -->
  <rect x="695" y="180" width="180" height="300" fill="#d9eafd" stroke="#0c66e4" stroke-width="2"/>
  <path d="M720 435V230H770V435M800 230V435H850V230" fill="none" stroke="#0c66e4" stroke-width="3"/>
  <text x="785" y="310" text-anchor="middle" class="label">楼梯</text>
  <text x="785" y="337" text-anchor="middle" class="small">上层落地平台接通道</text>

  <!-- 1.2m wide connecting corridor, 1.1m long -->
  <rect x="713" y="480" width="72" height="66" fill="#dff3ff" stroke="#0c66e4" stroke-width="2"/>
  <text x="749" y="507" text-anchor="middle" class="small">1.2m</text>
  <text x="749" y="527" text-anchor="middle" class="small">通道</text>
  <!-- Reclaimed upper zone -->
  <rect x="785" y="480" width="90" height="66" fill="#d8f3dc" stroke="#2d9d58" stroke-width="2"/>
  <text x="830" y="507" text-anchor="middle" class="small">并入住宅</text>
  <text x="830" y="527" text-anchor="middle" class="small">玄关/储物</text>

  <!-- 1.5 x 1.5 waiting/turning square -->
  <rect x="713" y="546" width="90" height="90" fill="#fff1b8" stroke="#e2a400" stroke-width="3"/>
  <circle cx="758" cy="591" r="43" fill="none" stroke="#e2a400" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="758" y="583" text-anchor="middle" class="small">候梯净空</text>
  <text x="758" y="605" text-anchor="middle" class="small">约1.5×1.5m</text>
  <!-- Reclaimed side zone -->
  <rect x="803" y="546" width="72" height="90" fill="#d8f3dc" stroke="#2d9d58" stroke-width="2"/>
  <text x="839" y="579" text-anchor="middle" class="small">并入</text>
  <text x="839" y="601" text-anchor="middle" class="small">住宅</text>
  <text x="839" y="623" text-anchor="middle" class="small">空间</text>

  <!-- elevator -->
  <rect x="695" y="636" width="144" height="144" fill="#ffe2bd" stroke="#e56910" stroke-width="4"/>
  <line x1="697" y1="638" x2="837" y2="778" stroke="#e56910" stroke-width="2"/>
  <line x1="837" y1="638" x2="697" y2="778" stroke="#e56910" stroke-width="2"/>
  <text x="767" y="700" text-anchor="middle" class="label">电梯井</text>
  <text x="767" y="729" text-anchor="middle" class="small">2.4×2.4m</text>
  <rect x="839" y="636" width="36" height="144" fill="#d8f3dc" stroke="#2d9d58" stroke-width="2"/>
  <text x="857" y="710" text-anchor="middle" class="small" transform="rotate(-90 857 710)">柜体/管井/隔声带</text>
  <!-- door opening -->
  <line x1="735" y1="636" x2="789" y2="636" stroke="#fff" stroke-width="8"/>
  <line x1="735" y1="636" x2="789" y2="636" stroke="#e56910" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Flow arrow -->
  <path d="M750 462V500V532V570" fill="none" stroke="#0c66e4" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Dimensions and summary -->
  <line x1="900" y1="480" x2="900" y2="636" class="dimension"/>
  <text x="925" y="560" class="dim" transform="rotate(90 925 560)">结构余量2.6m</text>
  <line x1="670" y1="546" x2="670" y2="636" class="dimension"/>
  <text x="650" y="598" text-anchor="middle" class="dim" transform="rotate(-90 650 598)">候梯1.5m</text>

  <rect x="930" y="235" width="220" height="270" rx="10" fill="#fff" stroke="#b3bac5"/>
  <text x="950" y="270" class="label">建议控制</text>
  <text x="950" y="305" class="small">• 单台住宅电梯：</text>
  <text x="966" y="331" class="small">先按1.5m候梯净深</text>
  <text x="950" y="369" class="small">• 楼梯至电梯通道：</text>
  <text x="966" y="395" class="small">先按1.2m净宽</text>
  <text x="950" y="433" class="small">• 最终尺寸：</text>
  <text x="966" y="459" class="small">以轿厢深度、消防、</text>
  <text x="966" y="483" class="small">无障碍和当地审图为准</text>

  <text x="1150" y="850" text-anchor="end" class="small" fill="#6b778c">概念优化示意，不作为施工图</text>
</svg>
